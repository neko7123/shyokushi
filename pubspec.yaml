name: nutri_diary
description: A local-first food diary, nutrition tracker, and realistic weight-goal planner.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+2
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  share_plus: 13.3.1
  url_launcher: ^6.3.2
  http: ^1.5.0
  cryptography: ^2.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
